name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the version-bump commit can push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: version
        run: |
          node <<'EOF'
          const fs = require('fs');
          let next = null;
          for (const f of ['web/package.json', 'package.json']) {
            const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
            const parts = String(pkg.version || '0.1.0').split('.').map((n) => parseInt(n, 10) || 0);
            while (parts.length < 3) parts.push(0);
            parts[2] += 1;
            pkg.version = parts.join('.');
            fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            next = pkg.version;
            console.log(f, '->', pkg.version);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${next}\n`);
          EOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json package.json
          if git diff --staged --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.value }} [skip ci]"
            git push
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
